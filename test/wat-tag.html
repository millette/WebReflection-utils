<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module">
    import watTag from '../src/wat-tag.js';

    const wat = watTag();

    const { instance: { exports } } = await wat`
      (module
        (func $i (import "my_namespace" "imported_func") (param i32))
        (func (export "exported_func")
          i32.const 42
          call $i))
    `;

    exports.exported_func();
  </script>
</head>
</html>
